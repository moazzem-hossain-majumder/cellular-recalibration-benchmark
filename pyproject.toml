[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-throughput-benchmark"
version = "1.0.0"
description = "Reliability of Cellular Throughput Forecasts Across Networks with Missing Radio Telemetry"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Mithil Rahman"}
]
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.5.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.14.0",
  "scikit-learn>=1.5.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

