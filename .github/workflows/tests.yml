name: Research validation
on: [push, pull_request, workflow_dispatch]
jobs:
  published-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pypdf pymupdf beautifulsoup4
      - run: python scripts/validate_manuscript_consistency.py
  full-tests-with-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/prepare_ookla_traces.py
      - run: python -m pytest tests -ra --junitxml=tests.xml
      - run: python -c "import xml.etree.ElementTree as E; s=E.parse('tests.xml').find('.//testsuite'); assert int(s.get('tests'))>0 and int(s.get('skipped'))==0"

